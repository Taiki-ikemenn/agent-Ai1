<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>エージェントAi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="エージェントAi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1524">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f8fc; --panel:#ffffff; --panel2:#f1f4fa; --line:#e0e6f1; --line2:#d3dbea;
  --ink:#131a2b; --ink2:#4a5570; --ink3:#8a94ad;
  --side:#0f1524; --side2:#1b2338; --sideInk:#c6cfe3; --sideInk2:#6d7896;
  --acc:#4f6bff; --acc2:#2bd9a0; --accInk:#fff; --accSoft:#eaeeff; --warn:#f59e0b; --bad:#ef4444; --ok:#16a34a;
  --r:16px; --sh:0 18px 50px rgba(19,26,43,.12); --sh2:0 6px 18px rgba(19,26,43,.07);
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --safeT:env(safe-area-inset-top); --safeB:env(safe-area-inset-bottom);
}
[data-theme=dark]{
  --bg:#0c111d; --panel:#141b2b; --panel2:#1a2236; --line:#232c42; --line2:#2d3853;
  --ink:#e8edf8; --ink2:#aab4cc; --ink3:#6f7a96; --accSoft:#1e2650; --sh:0 18px 50px rgba(0,0,0,.45); --sh2:0 6px 18px rgba(0,0,0,.3);
  --side:#080c16; --side2:#151c2e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
::selection{background:color-mix(in srgb,var(--acc) 28%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink3) 40%,transparent);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
#app{height:100%;display:flex}

/* ---------- sidebar ---------- */
.side{width:276px;flex:none;background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;padding:calc(14px + var(--safeT)) 12px calc(12px + var(--safeB));gap:2px;transition:width .35s cubic-bezier(.2,.8,.2,1),transform .35s cubic-bezier(.2,.8,.2,1);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;margin:4px 8px 16px;color:#fff;font-weight:800;font-size:18px;letter-spacing:.01em}
.brand img{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 14px rgba(79,107,255,.45)}
.brand .collapse{margin-left:auto;background:none;border:0;color:var(--sideInk2);padding:6px;border-radius:8px}
.brand .collapse:hover{background:var(--side2);color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;color:inherit;text-align:left;width:100%;position:relative;transition:background .2s,color .2s}
.nav:hover{background:var(--side2);color:#fff}
.nav.on{background:var(--side2);color:#fff}
.nav.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--acc2)}
.nav.new{background:linear-gradient(135deg,var(--acc),#6d5dfc);color:#fff;font-weight:700;margin-bottom:10px;box-shadow:0 8px 20px rgba(79,107,255,.35)}
.nav.new:hover{filter:brightness(1.08)}
.nav .kbd{margin-left:auto;font-size:11px;opacity:.6}
.sideLab{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--sideInk2);margin:18px 12px 6px}
.recent{flex:1;overflow:auto;margin:0 -4px;padding:0 4px;display:flex;flex-direction:column;gap:1px;mask-image:linear-gradient(#000 92%,transparent)}
.rc{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:10px;border:0;background:none;color:var(--sideInk);text-align:left;width:100%;position:relative}
.rc b{font-weight:500;font-size:13.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dde4f3}
.rc small{font-size:11.5px;color:var(--sideInk2);display:flex;gap:6px;align-items:center}
.rc .dot{width:7px;height:7px;border-radius:50%}
.rc:hover,.rc.on{background:var(--side2)}
.rc .rcx{position:absolute;right:6px;top:50%;transform:translateY(-50%);opacity:0;background:none;border:0;color:var(--sideInk2);padding:4px;border-radius:6px}
.rc:hover .rcx{opacity:1}.rc .rcx:hover{color:#fff;background:#2a3450}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid #1d2640;margin-top:8px}
.me .av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--acc2);color:#0b1220;display:grid;place-items:center;font-weight:800;flex:none}
.me b{color:#fff;font-size:14px;display:block}.me small{font-size:11.5px;color:var(--sideInk2);display:flex;align-items:center;gap:5px}
.me .sync{width:7px;height:7px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 3px rgba(43,217,160,.18)}
.me .sync.off{background:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.18)}
body.sideMini .side{width:74px}
body.sideMini .side .lbl,body.sideMini .sideLab,body.sideMini .recent,body.sideMini .me div,body.sideMini .brand span,body.sideMini .nav .kbd{display:none}
body.sideMini .nav{justify-content:center}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:calc(60px + var(--safeT));padding:var(--safeT) 22px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.top h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menuBtn{display:none}
.sp{flex:1}
.view{flex:1;min-height:0;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow:auto;animation:pageIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}
.wrap{max-width:1040px;margin:0 auto;padding:28px 28px 60px}
.pageHead{display:block;margin-bottom:22px}
.pageHead h2{margin:0;font-size:26px;letter-spacing:.01em}
.pageHead p{margin:6px 0 0;color:var(--ink2);line-height:1.7;max-width:70ch}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk);box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 30%,transparent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.icon{padding:8px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--panel2);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink2);transition:all .2s}
.chip.on{background:var(--accSoft);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
button.chip:hover{border-color:var(--line2)}
.field,textarea.field,select.field{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
textarea.field{resize:vertical;min-height:90px;line-height:1.6}
label.lab{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.help{font-size:12.5px;color:var(--ink3);margin-top:5px;line-height:1.6}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh2)}
.muted{color:var(--ink3)}
.hr{height:1px;background:var(--line);margin:18px 0}

/* dropdown */
.dd{position:relative;display:inline-block}
.ddBtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:7px 12px 7px 13px;font-size:13.5px;font-weight:600;max-width:260px}
.ddBtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddBtn .chev{transition:transform .25s;opacity:.6}
.dd.open .ddBtn .chev{transform:rotate(180deg)}
.ddMenu{position:absolute;top:calc(100% + 6px);left:0;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:6px;z-index:50;transform-origin:top left;animation:ddIn .22s cubic-bezier(.2,.8,.2,1);max-height:60vh;overflow:auto}
.ddMenu.right{left:auto;right:0;transform-origin:top right}
@keyframes ddIn{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.ddItem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left;font-size:14px}
.ddItem:hover{background:var(--panel2)}
.ddItem.on{color:var(--acc);font-weight:700}
.ddItem small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.ddItem .ck{margin-left:auto;opacity:0}.ddItem.on .ck{opacity:1}
.ddSep{height:1px;background:var(--line);margin:5px 4px}

/* slider */
.sl{display:flex;align-items:center;gap:12px}
.sl input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--line2) var(--p,50%));outline:none}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 3px 10px rgba(19,26,43,.2);transition:transform .15s}
.sl input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
.sl output{min-width:64px;text-align:right;font-weight:700;font-size:13px;color:var(--ink2)}

/* toggle */
.tg{width:46px;height:28px;border-radius:999px;border:0;background:var(--line2);position:relative;transition:background .25s;flex:none;padding:0}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(18px)}
.setRow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setRow:last-child{border-bottom:0}
.setRow .t{flex:1}.setRow .t b{display:block;font-size:14.5px}.setRow .t small{color:var(--ink3);font-size:12.5px}

/* segmented */
.seg{display:inline-flex;background:var(--panel2);border-radius:12px;padding:3px;position:relative;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);position:relative;z-index:1;transition:color .2s;display:inline-flex;gap:6px;align-items:center}
.seg button.on{color:var(--ink)}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:9px;background:var(--panel);box-shadow:var(--sh2);transition:left .3s cubic-bezier(.3,1.1,.4,1),width .3s cubic-bezier(.3,1.1,.4,1)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:80;display:grid;place-items:center;animation:fade .25s;padding:20px}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border-radius:22px;box-shadow:var(--sh);width:min(560px,100%);max-height:88vh;overflow:auto;padding:24px;animation:pop .32s cubic-bezier(.2,1.2,.3,1)}
.modal.wide{width:min(900px,100%)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
.modal h3{margin:0 0 6px;font-size:20px}
.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

/* toast */
#toasts{position:fixed;left:50%;bottom:calc(22px + var(--safeB));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:#131a2b;color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;animation:toastIn .35s cubic-bezier(.2,1.3,.3,1);max-width:90vw}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}}@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* ---------- chat ---------- */
.chatPage{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto;padding:26px 0 30px;scroll-behavior:smooth}
.msgs .inner{max-width:820px;margin:0 auto;padding:0 26px;display:flex;flex-direction:column;gap:22px}
.m{display:flex;gap:14px;animation:msgIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}}
.m.user{justify-content:flex-end}
.m.user .bub{background:var(--ink);color:var(--bg);border-radius:20px 20px 6px 20px;padding:11px 16px;max-width:78%;white-space:pre-wrap;line-height:1.65;word-break:break-word}
[data-theme=dark] .m.user .bub{background:#2a3555;color:#fff}
.m.user .atts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}
.m .avA{width:32px;height:32px;border-radius:10px;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;margin-top:2px}
.m .avA svg{width:18px;height:18px}
.m.ai .body{flex:1;min-width:0;line-height:1.8;font-size:15.5px}
.md p{margin:0 0 .8em}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{margin:1.1em 0 .5em;line-height:1.35}.md h1{font-size:1.4em}.md h2{font-size:1.22em}.md h3{font-size:1.08em}
.md ul,.md ol{padding-left:1.4em;margin:.3em 0 .9em}.md li{margin:.2em 0}
.md a{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.md code{font-family:var(--mono);font-size:.88em;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:.1em .4em}
.md blockquote{margin:.6em 0;padding:.2em 1em;border-left:3px solid var(--acc);color:var(--ink2)}
.md table{border-collapse:collapse;margin:.6em 0;font-size:.93em;display:block;overflow:auto}.md th,.md td{border:1px solid var(--line2);padding:7px 11px;text-align:left}.md th{background:var(--panel2)}
.md hr{border:0;height:1px;background:var(--line);margin:1em 0}
.code{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:.6em 0 1em;background:#0f1524}
.codeHead{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;background:#161e31;color:#9aa6c3;font-size:12.5px;font-family:var(--mono)}
.codeHead .sp{flex:1}
.codeHead button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:#c6cfe3;border-radius:8px;padding:5px 8px;font-size:12.5px;font-family:var(--font)}
.codeHead button:hover{background:#233050;color:#fff}
.code pre{margin:0;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.65;color:#dbe3f5;max-height:520px}
.tk-k{color:#c792ea}.tk-s{color:#a5e88f}.tk-c{color:#6b7896;font-style:italic}.tk-n{color:#f8a76b}.tk-f{color:#82aaff}.tk-t{color:#ff8fa3}.tk-a{color:#ffcb6b}
.steps{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.step{border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:13.5px;overflow:hidden;transition:border-color .2s}
.step summary{list-style:none;display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;color:var(--ink2)}
.step summary::-webkit-details-marker{display:none}
.step summary b{color:var(--ink);font-weight:600}
.step .st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.step .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.step .okd{width:8px;height:8px;border-radius:50%;background:var(--acc2)}
.step .bad{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.step pre{margin:0;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto;color:var(--ink2)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:14px}
.thinking i{display:inline-flex;gap:4px}.thinking i span{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:bounce 1.2s infinite}
.thinking i span:nth-child(2){animation-delay:.15s;background:#7c6cff}.thinking i span:nth-child(3){animation-delay:.3s;background:var(--acc2)}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-6px);opacity:1}}
.mActs{display:flex;gap:2px;margin-top:8px;opacity:0;transition:opacity .2s}
.m:hover .mActs{opacity:1}
.mActs button{border:0;background:none;color:var(--ink3);padding:6px;border-radius:8px}.mActs button:hover{background:var(--panel2);color:var(--ink)}
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px;background:var(--panel);color:var(--ink2);text-decoration:none;max-width:240px}
.src img{width:16px;height:16px;border-radius:4px}.src span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileCard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;margin:.5em 0;max-width:460px;box-shadow:var(--sh2)}
.fileCard .fi{width:42px;height:42px;border-radius:11px;background:var(--accSoft);color:var(--acc);display:grid;place-items:center;flex:none}
.fileCard .fi svg{width:20px;height:20px}
.fileCard b{display:block;font-size:14px;word-break:break-all}.fileCard small{color:var(--ink3);font-size:12px}
.fileCard .sp{flex:1}
.media{margin:.5em 0;border-radius:16px;overflow:hidden;border:1px solid var(--line);max-width:520px;background:var(--panel2);position:relative}
.media img,.media video{display:block;width:100%;height:auto}
.media audio{width:100%;display:block}
.media .mBar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel);font-size:13px}
.media .mBar b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attChip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:6px 8px 6px 6px;font-size:13px;max-width:220px;animation:pop .3s}
.attChip img{width:30px;height:30px;border-radius:7px;object-fit:cover}
.attChip .ai{width:30px;height:30px;border-radius:7px;background:var(--accSoft);color:var(--acc);display:grid;place-items:center}
.attChip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attChip button{border:0;background:none;color:var(--ink3);padding:2px;display:grid}
.m.user .attChip{background:var(--panel);color:var(--ink)}

/* composer */
.composer{padding:0 26px calc(18px + var(--safeB));}
.cbox{max-width:820px;margin:0 auto;border:1px solid var(--line2);background:var(--panel);border-radius:22px;box-shadow:0 10px 30px rgba(19,26,43,.08);transition:border-color .2s,box-shadow .3s}
.cbox.focus{border-color:color-mix(in srgb,var(--acc) 55%,var(--line2));box-shadow:0 10px 34px color-mix(in srgb,var(--acc) 18%,transparent)}
.cbox.drag{border-color:var(--acc);border-style:dashed}
.cAtts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.cbox textarea{width:100%;border:0;outline:none;background:none;resize:none;padding:14px 16px 6px;max-height:240px;line-height:1.6;font-size:15.5px}
.cBar{display:flex;align-items:center;gap:6px;padding:6px 8px 8px 10px;flex-wrap:wrap}
.cBar .sp{flex:1}
.send{width:40px;height:40px;border-radius:13px;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;transition:transform .15s,background .2s,opacity .2s}
.send:active{transform:scale(.92)}.send[disabled]{opacity:.35}
.send.stop{background:var(--ink)}
.hint{max-width:820px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--ink3)}

/* welcome */
.welcome{max-width:820px;margin:0 auto;padding:8vh 26px 20px;text-align:left;animation:pageIn .6s}
.welcome .orb{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--acc),#7c6cff 50%,var(--acc2));box-shadow:0 18px 40px rgba(79,107,255,.35);display:grid;place-items:center;color:#fff;margin-bottom:22px;animation:float 5s ease-in-out infinite}
.welcome .orb svg{width:30px;height:30px}
@keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
.welcome h2{font-size:30px;margin:0 0 6px;letter-spacing:.01em}
.welcome p{color:var(--ink2);margin:0 0 26px}
.sugg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sugg button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;transition:transform .2s,border-color .2s,box-shadow .2s}
.sugg button:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--sh2)}
.sugg i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-style:normal}
.sugg b{display:block;font-size:14px}.sugg small{color:var(--ink3);font-size:12.5px}

/* ---------- lists / cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;overflow:hidden}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--line2)}
.pcard.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.pcard .pic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:14px}
.pcard .pic svg{width:22px;height:22px}
.pcard h4{margin:0 0 4px;font-size:16px}.pcard p{margin:0;color:var(--ink3);font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .meta{display:flex;gap:12px;margin-top:14px;font-size:12px;color:var(--ink3)}
.pcard .meta span{display:flex;gap:5px;align-items:center}
.pcard .badge{position:absolute;right:14px;top:14px;font-size:11px;font-weight:700;color:var(--acc);background:var(--accSoft);border-radius:999px;padding:3px 9px}
.pcard.add{display:grid;place-items:center;text-align:center;border-style:dashed;color:var(--ink3);min-height:170px}
.empty{text-align:center;color:var(--ink3);padding:60px 20px}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--panel2);display:grid;place-items:center;margin:0 auto 14px;color:var(--ink3)}
.empty .ei svg{width:28px;height:28px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* library */
.libGrid{columns:4 220px;column-gap:14px}
.libItem{break-inside:avoid;margin-bottom:14px;border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;position:relative;transition:transform .25s,box-shadow .25s;animation:pageIn .4s backwards}
.libItem:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.libItem img,.libItem video{display:block;width:100%}
.libItem .lt{padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.libItem .lt b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libItem .kind{position:absolute;left:10px;top:10px;background:rgba(15,21,36,.72);color:#fff;font-size:11px;border-radius:999px;padding:3px 9px;display:flex;gap:4px;align-items:center;backdrop-filter:blur(6px)}
.libItem .ph{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(135deg,var(--accSoft),var(--panel2));color:var(--acc)}
.libItem .ph svg{width:34px;height:34px}
.viewer{display:flex;gap:20px;align-items:flex-start}.viewer .vm{flex:1.4;min-width:0}.viewer .vi{flex:1}
.viewer .vm img,.viewer .vm video{width:100%;border-radius:14px;display:block}

/* schedules */
.sch{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
.sch:hover{box-shadow:var(--sh2)}
.sch .si{width:42px;height:42px;border-radius:12px;background:var(--accSoft);color:var(--acc);display:grid;place-items:center;flex:none}
.sch .st{flex:1;min-width:0}.sch .st b{display:block}.sch .st small{color:var(--ink3);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.sch.off{opacity:.55}
.runs{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.run{font-size:13px;border-left:3px solid var(--acc2);padding:4px 10px;color:var(--ink2)}

/* feed */
.feedWrap{max-width:680px;margin:0 auto;padding:24px 20px 60px}
.post{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:16px;overflow:hidden;box-shadow:var(--sh2);animation:pageIn .5s backwards}
.post .ph{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.post .ph .pa{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.post .ph b{display:block;font-size:14px}.post .ph small{color:var(--ink3);font-size:12px}
.post .pimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--panel2)}
.post .pb{padding:12px 16px 4px}.post .pb h3{margin:0 0 6px;font-size:17px;line-height:1.45}.post .pb p{margin:0;color:var(--ink2);line-height:1.75;font-size:14.5px}
.post .pf{display:flex;gap:4px;padding:8px 10px 10px;align-items:center}
.post .pf button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink3);padding:7px 10px;border-radius:10px;font-size:13px}
.post .pf button:hover{background:var(--panel2);color:var(--ink)}
.post .pf button.on{color:#e11d48}
.post .tags{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0}.post .tags span{font-size:12px;color:var(--acc);background:var(--accSoft);border-radius:6px;padding:2px 8px}
.skel{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:10px}
@keyframes shim{to{background-position:-200% 0}}

/* customize */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow:auto}
.tabs button{border:0;background:none;padding:11px 14px;font-weight:600;color:var(--ink3);position:relative;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--acc);animation:grow .3s}
@keyframes grow{from{transform:scaleX(0)}}
.conn{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:box-shadow .2s}
.conn:hover{box-shadow:var(--sh2)}
.conn .ci{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff}
.conn .ci svg{width:22px;height:22px}
.conn .ct{flex:1;min-width:0}.conn .ct b{display:block}.conn .ct small{color:var(--ink3);font-size:12.5px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.status.on{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.status.off{color:var(--ink3);background:var(--panel2)}
.status.half{color:#b45309;background:color-mix(in srgb,var(--warn) 15%,transparent)}
.connGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px}
.memItem{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.memItem .mt{flex:1}.memItem .mt small{color:var(--ink3);font-size:12px}
.memItem button{opacity:.5}.memItem:hover button{opacity:1}

/* code page */
.codePage{display:flex;height:100%}
.codeChat{width:400px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.codeChat .msgs .inner{padding:0 16px}
.codeChat .composer{padding:0 12px calc(12px + var(--safeB))}
.codeWork{flex:1;display:flex;flex-direction:column;min-width:0}
.codeTabs{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.fileTab{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:9px;padding:6px 10px;font-size:13px;font-family:var(--mono);color:var(--ink2)}
.fileTab.on{background:var(--panel2);border-color:var(--line);color:var(--ink)}
.fileTab .fx{opacity:.4;padding:0;border:0;background:none;display:grid}.fileTab .fx:hover{opacity:1}
.editor{flex:1;display:flex;min-height:0;background:#0f1524;position:relative}
.editor .ln{padding:14px 8px 14px 14px;color:#4b5675;font-family:var(--mono);font-size:13px;line-height:1.65;text-align:right;user-select:none;white-space:pre;overflow:hidden}
.editor .edw{position:relative;flex:1;overflow:auto}
.editor textarea,.editor pre{position:absolute;inset:0;margin:0;padding:14px 16px 14px 6px;font-family:var(--mono);font-size:13px;line-height:1.65;white-space:pre;border:0;outline:none;tab-size:2;min-width:100%;min-height:100%}
.editor textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;z-index:1;overflow:hidden}
.editor pre{color:#dbe3f5;pointer-events:none}
.preview{height:42%;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
.preview iframe{flex:1;border:0;background:#fff}
.preview .pvh{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.console{max-height:110px;overflow:auto;font-family:var(--mono);font-size:12px;padding:6px 12px;background:var(--panel2);border-top:1px solid var(--line)}
.console div{padding:1px 0}.console .err{color:var(--bad)}

/* login */
.login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% -10%,#1d2a63 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#0f4d44 0%,transparent 55%),#0b1020;color:#fff;z-index:100;padding:20px}
.login .lc{width:min(420px,100%);text-align:center;animation:pop .6s cubic-bezier(.2,1.2,.3,1)}
.login img{width:84px;height:84px;border-radius:24px;box-shadow:0 20px 50px rgba(79,107,255,.5);margin-bottom:22px}
.login h1{margin:0 0 8px;font-size:30px}.login p{color:#aeb8d2;margin:0 0 28px;line-height:1.7}
.login .btn{width:100%;padding:13px;border-radius:14px;font-size:15px;margin-bottom:10px;background:#fff;color:#131a2b;border:0}
.login .btn.alt{background:rgba(255,255,255,.1);color:#fff}
.login .feat{display:flex;justify-content:center;gap:18px;margin-top:22px;color:#8f9bbb;font-size:12.5px}
.login .feat span{display:flex;gap:6px;align-items:center}
.login .orbs i{position:fixed;border-radius:50%;filter:blur(60px);opacity:.5;animation:drift 18s ease-in-out infinite}
@keyframes drift{50%{transform:translate(40px,-30px) scale(1.1)}}

/* mobile */
.mScrim{display:none}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--sh)}
  body.sideOpen .side{transform:none}
  body.sideOpen .mScrim{display:block;position:fixed;inset:0;background:rgba(10,14,26,.4);z-index:15;animation:fade .25s}
  .menuBtn{display:inline-flex}
  .sugg{grid-template-columns:1fr}
  .codePage{flex-direction:column}.codeChat{width:auto;height:45%;border-right:0;border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}.viewer{flex-direction:column}
  .wrap{padding:20px 16px 60px}.top{padding-left:12px;padding-right:12px}
  .msgs .inner,.composer{padding-left:14px;padding-right:14px}
  .connGrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.dd.iconOnly .ddBtn span,.dd.iconOnly .ddBtn .chev{display:none}
.dd.iconOnly .ddBtn{padding:8px 10px}
@media (max-width:600px){
  .top{padding-left:12px;padding-right:12px;gap:6px}
  .top .ddBtn span{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .btn .lbl{display:none}
  .top input.field{width:120px!important}
}
@media (max-width:860px){ .brand .collapse,.nav .kbd{display:none} }
a.btn{text-decoration:none;color:var(--ink)}a.btn.pri{color:#fff}

.ddMenu.up{top:auto;bottom:calc(100% + 6px);transform-origin:bottom left}
.ddMenu.right.up{transform-origin:bottom right}
.ddItem div{min-width:0}
/* @メンション */
.mention{position:absolute;left:12px;bottom:calc(100% + 8px);width:min(360px,calc(100% - 24px));max-height:320px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:6px;z-index:60;animation:ddIn .2s cubic-bezier(.2,.8,.2,1);transform-origin:bottom left}
.mention .mh{font-size:11.5px;color:var(--ink3);padding:6px 10px 4px}
.mention button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;text-align:left}
.mention button.on,.mention button:hover{background:var(--accSoft)}
.mention .mi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.mention .mi svg{width:16px;height:16px}
.mention b{display:block;font-size:14px}.mention small{display:block;color:var(--ink3);font-size:12px}
.mention .off{margin-left:auto;font-size:11px;color:var(--ink3);white-space:nowrap}
.cbox{position:relative}
.mtag{display:inline-block;background:color-mix(in srgb,var(--acc) 22%,transparent);color:inherit;border-radius:6px;padding:0 5px;font-weight:700}
.mPills{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
.mPills span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px 3px 6px;color:#fff}
.mPills span svg{width:13px;height:13px}

.sib{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--ink3);margin-right:4px}
.sib button{padding:4px!important}
.uActs{justify-content:flex-end;margin-top:4px}
.m.user:hover .mActs{opacity:1}
@media (pointer:coarse){ .mActs{opacity:.7} }
.editBox{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:10px;box-shadow:var(--sh2)}
.md.streaming>*:last-child::after{content:"";display:inline-block;width:8px;height:1.1em;background:var(--acc);margin-left:3px;vertical-align:-.15em;border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* 質問カード */
.ask{border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));background:var(--panel);border-radius:18px;margin:8px 0 12px;box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 12%,transparent);overflow:hidden;animation:pop .35s cubic-bezier(.2,1.2,.3,1)}
.askHead{display:flex;align-items:center;gap:9px;padding:12px 16px;background:color-mix(in srgb,var(--acc) 8%,var(--panel));border-bottom:1px solid var(--line)}
.askHead svg{color:var(--acc)}.askHead small{color:var(--ink3)}.askHead .sp{flex:1}
.askBody{padding:16px}
.askQ{font-weight:700;font-size:16px;line-height:1.6;margin-bottom:12px}
.askOps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.askOp{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:10px 12px;font-size:14px;transition:all .18s}
.askOp:hover{border-color:var(--acc)}
.askOp .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent;transition:all .18s}
.askOp .ck svg{width:13px;height:13px}
.askOp.on{border-color:var(--acc);background:var(--accSoft);color:var(--acc);font-weight:700}
.askOp.on .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.askOther{margin-top:2px}
.askDots{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.askDots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--line2);padding:0;transition:all .2s}
.askDots button.ok{background:color-mix(in srgb,var(--acc) 45%,var(--line2))}
.askDots button.on{background:var(--acc);width:22px;border-radius:6px}
.askFoot{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}.askFoot .sp{flex:1}
.ask.done{box-shadow:none;border-color:var(--line)}
.askSum{display:flex;flex-direction:column;gap:8px;padding:10px 16px 14px;font-size:14px}.askSum small{color:var(--ink3);font-size:12px}
/* 計画 */
.plan{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px;margin:6px 0 12px}
.planHead{display:flex;align-items:center;gap:8px}.planHead svg{color:var(--acc)}.planHead .sp{flex:1}.planHead small{color:var(--ink3)}
.planBar{height:5px;border-radius:5px;background:var(--panel2);margin:10px 0 8px;overflow:hidden}.planBar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.planStep{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;font-size:14px}
.planStep .pi{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink3);flex:none}
.planStep .pi svg{width:13px;height:13px}.planStep .pi .spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--acc);animation:spin .8s linear infinite}
.planStep.done .pi{background:var(--acc2);color:#fff}.planStep.done>div>div{color:var(--ink3);text-decoration:line-through}
.planStep.doing .pi{background:var(--accSoft)}.planStep.doing{font-weight:700}
.planStep small{display:block;color:var(--ink3);font-size:12px;font-weight:400}

</style>
</head>
<body>
<div id="app"></div>

function mdInline(s){ s=esc(s);
  s=s.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>');
  s=s.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:12px">');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/~~([^~]+)~~/g,'<s>$1</s>');
  return s; }
function md(text){ const root=h('div',{class:'md'}); const lines=String(text||'').replace(/\r/g,'').split('\n'); let i=0, buf=[];
  const flushP=()=>{ if(buf.length){ root.append(h('p',{html:buf.map(mdInline).join('<br>')})); buf=[]; } };
  while(i<lines.length){ const l=lines[i];
    const fence=l.match(/^\s*```\s*([\w+#.-]*)\s*(?:\s+([\w./-]+))?\s*$/); if(fence){ flushP(); const lang=fence[1]; const nm=fence[2]; const code=[]; i++; while(i<lines.length&&!/^\s*```\s*$/.test(lines[i])){ code.push(lines[i]); i++; } i++; root.append(codeBlock(code.join('\n'),lang,nm)); continue; }
    const hd=l.match(/^(#{1,3})\s+(.*)/); if(hd){ flushP(); root.append(h('h'+hd[1].length,{html:mdInline(hd[2])})); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ flushP(); root.append(h('hr')); i++; continue; }
    if(/^\s*>/.test(l)){ flushP(); const q=[]; while(i<lines.length&&/^\s*>/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; } root.append(h('blockquote',{html:q.map(mdInline).join('<br>')})); continue; }
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){ flushP(); const row=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()); const th=row(l); i+=2; const t=h('table'); t.append(h('tr',{html:th.map(c=>'<th>'+mdInline(c)+'</th>').join('')})); while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){ t.append(h('tr',{html:row(lines[i]).map(c=>'<td>'+mdInline(c)+'</td>').join('')})); i++; } root.append(t); continue; }
    const li=l.match(/^(\s*)([-*+]|\d+\.)\s+(.*)/); if(li){ flushP(); const ordered=/\d/.test(li[2]); const list=h(ordered?'ol':'ul'); while(i<lines.length){ const m=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)/); if(!m) break; const t=m[3].replace(/^\[( |x)\]\s*/i,(x,c)=>c.trim()?'☑ ':'☐ '); list.append(h('li',{html:mdInline(t)})); i++; } root.append(list); continue; }
    if(!l.trim()){ flushP(); i++; continue; }
    buf.push(l); i++; }
  flushP(); return root; }

  const j=await r.json().catch(()=>({})); if(!r.ok){ const er=j.error||{}; const e=new Error(er.message||('HTTP '+r.status)); e.status=r.status; e.model=model; const ri=(er.details||[]).find(d=>/RetryInfo/.test(d['@type']||'')); e.retry=ri?parseFloat(ri.retryDelay)||0:0; e.daily=/PerDay|per day|_day/i.test(JSON.stringify(er)); e.zero=/limit: 0\b|limit:0\b/.test(er.message||''); throw e; } return j; }
// 文字を少しずつ受けとる（SSE）。部品はまとめなおして、関数呼び出しの署名も保つ
async function geminiStreamRaw(model,body,signal,onDelta){ const k=geminiKey().key; if(!k) throw new Error('NOKEY');
  const r=await fetch(GBASE+encodeURIComponent(model)+':streamGenerateContent?alt=sse',{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify(body)});
  if(!r.ok){ const j=await r.json().catch(()=>({})); const er=(Array.isArray(j)?j[0]:j).error||{}; const e=new Error(er.message||('HTTP '+r.status)); e.status=r.status; e.model=model; const ri=(er.details||[]).find(d=>/RetryInfo/.test(d['@type']||'')); e.retry=ri?parseFloat(ri.retryDelay)||0:0; e.daily=/PerDay|per day|_day/i.test(JSON.stringify(er)); e.zero=/limit: 0\b|limit:0\b/.test(er.message||''); throw e; }
  if(!r.body||!r.body.getReader){ const t=await r.text(); return parseSSE(t,onDelta); }
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf='', st={parts:[],finish:'',gm:null,text:''};
  for(;;){ const {done,value}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); let i; while((i=buf.indexOf('\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1); if(line.startsWith('data:')) sseChunk(line.slice(5).trim(),st,onDelta); } }
  if(buf.trim().startsWith('data:')) sseChunk(buf.trim().slice(5).trim(),st,onDelta);
  return {candidates:[{content:{role:'model',parts:st.parts},finishReason:st.finish,groundingMetadata:st.gm}]}; }
function parseSSE(t,onDelta){ const st={parts:[],finish:'',gm:null,text:''}; t.split('\n').forEach(l=>{ l=l.trim(); if(l.startsWith('data:')) sseChunk(l.slice(5).trim(),st,onDelta); }); return {candidates:[{content:{role:'model',parts:st.parts},finishReason:st.finish,groundingMetadata:st.gm}]}; }
function sseChunk(s,st,onDelta){ if(!s||s==='[DONE]') return; let j; try{ j=JSON.parse(s); }catch(e){ return; } const c=j.candidates&&j.candidates[0]; if(!c) return; if(c.finishReason) st.finish=c.finishReason; if(c.groundingMetadata) st.gm=c.groundingMetadata;
  for(const p of ((c.content&&c.content.parts)||[])){ const last=st.parts[st.parts.length-1]; const isT=x=>x&&x.text!=null&&!x.functionCall;
    if(isT(p)&&isT(last)&&!!p.thought===!!last.thought){ last.text+=p.text; if(p.thoughtSignature) last.thoughtSignature=p.thoughtSignature; } else st.parts.push({...p});
    if(p.text&&!p.thought){ st.text+=p.text; onDelta&&onDelta(st.text); } } }
// 役割（fast/pro/lite）かモデル名を受けとり、だめなら次のモデルへ。
// 1分あたりの回数オーバーは、まず別のモデル（回数は別々）を試し、全部だめなら少し待ってもう一周
async function gemini(roleOrModel,body,signal,{maxWait=25,rounds=2,stream}={}){ const role=roleOf(roleOrModel); const chain=['fast','pro','lite'].includes(roleOrModel)||/^gemini-[12]\./.test(roleOrModel)?await modelChain(role):[roleOrModel]; let last;
  const grounding=/google_search|url_context/.test(JSON.stringify(body.tools||[])); // 検索の上限でモデル自体を「使えない」と覚えないように
  const mark=(m,ms)=>{ if(grounding) return; MODEL.bad[m]=Date.now()+ms; LS.set('modelBad',MODEL.bad); };
  for(let r=0;r<rounds;r++){ let wait=0, tried=0;
    for(const m of chain){ if(MODEL.bad[m]>Date.now()&&chain.some(x=>!(MODEL.bad[x]>Date.now()))) continue; tried++;
      for(let t=0;t<2;t++){ try{ const j=stream?await geminiStreamRaw(m,body,signal,stream):await geminiRaw(m,body,signal); if(MODEL.work[role]!==m&&!grounding){ MODEL.work[role]=m; LS.set('modelWork',MODEL.work); BUS.emit('model'); } return j; }
        catch(e){ last=e; if(e.name==='AbortError'||e.message==='NOKEY'||/API key|API_KEY|PERMISSION_DENIED|UNAUTHENTICATED/i.test(e.message)) throw e;
          if(e.status===404||(e.status===400&&/not (found|supported)|unsupported model|is not available/i.test(e.message))){ mark(m,24*3600e3); break; }
          if(e.status===429){ if(e.zero) mark(m,24*3600e3); else if(e.daily) mark(m,30*60e3); else wait=Math.max(wait,e.retry||6); break; }
          if(e.status>=500&&t<1){ await sleep(2000); continue; } if(e.status>=500) break; throw e; } } }
    if(!wait||r===rounds-1) break; const w=Math.min(maxWait,Math.max(3,wait)); BUS.emit('wait',w); await sleep(w*1000); }
  throw last||new Error('使えるモデルが見つかりません'); }
async function geminiText(prompt,{model,sys,json=false,signal,tools,maxWait,rounds}={}){ const body={contents:[{role:'user',parts:[{text:prompt}]}]}; if(sys) body.systemInstruction={parts:[{text:sys}]}; if(json&&!tools) body.generationConfig={responseMimeType:'application/json'}; if(tools) body.tools=tools;
  const j=await gemini(model||S.settings.model||'lite',body,signal,{maxWait,rounds}); const c=j.candidates&&j.candidates[0]; const t=((c&&c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join(''); if(json){ try{ return JSON.parse(t.replace(/^\s*```(json)?|```\s*$/g,'')); }catch(e){ const m=t.match(/[\[{][\s\S]*[\]}]/); return m?JSON.parse(m[0]):null; } } return {text:t,cand:c}; }
function errText(e){ const m=String(e&&e.message||e); if(m==='NOKEY') return 'Geminiのキーが見つかりません。カスタマイズ → 一般 で確認してください。'; if(e&&e.name==='AbortError') return '止めました。';
  if(/API key not valid|API_KEY_INVALID|UNAUTHENTICATED|invalid authentication/i.test(m)) return 'Geminiのキーが使えないようです（'+m.slice(0,120)+'）。キーを確認してください。';
  if(e&&e.status===429||/quota|RESOURCE_EXHAUSTED/i.test(m)) return (e&&e.daily?'今日のGeminiの無料回数を使い切ったようです（日本時間の夕方5時ごろにリセット）。':'Geminiが混み合っているか、短い時間に呼びすぎました。1分ほど待ってからもう一度ためしてください。')+'\n（くわしく：'+(e&&e.model?e.model+' / ':'')+m.slice(0,160)+'）';
  return 'エラー：'+m.slice(0,300); }

大事な前提があいまいなとき（好みや条件で結果が大きく変わる作業）は、作り始める前に ask_user で選択肢つきの質問をまとめて聞く（ふつうの雑談では聞かない）。

使えるアプリ接続：${conns||'なし'}。
${ins.about?'ユーザーについて（本人が書いたもの）：\n'+ins.about+'\n':''}${ins.style?'返答のしかたの希望：\n'+ins.style+'\n':''}${p?`いまのプロジェクト「${p.name}」\n${p.instr||''}\n`:''}${mems?'覚えていること（メモリー）：\n'+mems+'\n':''}${extra}`; }

/* ---------- 会話の履歴をGeminiの形にする ---------- */
async function toContents(msgs){ const out=[]; for(const m of msgs){ if(m.role==='user'){ const parts=[]; for(const a of (m.atts||[])){ const p=await attPart(a); if(p) parts.push(p); } parts.push({text:m.text||'（ファイルを送りました）'}); out.push({role:'user',parts}); }
    else if(m.role==='model'){ let t=m.text||''; if(m.files&&m.files.length) t+='\n（作ったファイル：'+m.files.map(f=>f.name).join('、')+'）'; if(m.media&&m.media.length) t+='\n（作ったもの：'+m.media.map(x=>x.name||x.kind).join('、')+'）'; out.push({role:'model',parts:[{text:t||'…'}]}); } }
  // 同じ役割が続くとエラーになるのでまとめる
  const merged=[]; out.forEach(c=>{ const l=merged[merged.length-1]; if(l&&l.role===c.role) l.parts.push(...c.parts); else merged.push(c); }); if(merged[0]&&merged[0].role!=='user') merged.unshift({role:'user',parts:[{text:'（つづき）'}]}); return merged; }
async function attPart(a){ try{ if(a.text!=null) return {text:`【ファイル：${a.name}】\n${a.text.slice(0,200000)}`}; let data=a.data; if(!data){ const b=await IDB.get('att_'+a.id); if(b) data=await blobToB64(b); } if(!data){ try{ const d=await FB.m.getDoc(DB.doc('atts',a.id)); if(d.exists()) data=d.data().data; }catch(e){} } if(!data) return {text:`【ファイル：${a.name}（この端末にないため読めません）】`}; return {inlineData:{mimeType:a.mime,data:data.replace(/^data:[^,]+,/,'')}}; }catch(e){ return null; } }

/* ---------- エージェントの動き（考える→道具→たしかめる→答える） ---------- */
function codeBlocksToFiles(res){ const ext={html:'html',htm:'html',css:'css',javascript:'js',js:'js',python:'py',py:'py',json:'json',svg:'svg',markdown:'md',md:'md',csv:'csv',txt:'txt',text:'txt',ts:'ts',typescript:'ts'}; let n=0;
  for(const m of String(res.text).matchAll(/```\s*([\w+#.-]*)[^\n]*\n([\s\S]*?)```/g)){ const lang=(m[1]||'txt').toLowerCase(); const e=ext[lang]||'txt'; const content=m[2].replace(/\n$/,''); if(content.length<20) continue; n++; const name=(e==='html'&&!res.files.some(f=>f.name==='index.html'))?'index.html':`file${n}.${e}`; res.files.push({name,content,size:new Blob([content]).size,note:'返事の中のコードから作りました'}); } }
async function runAgent({msgs,onStep,onText,signal,extraSys='',ctx={},maxRounds=12,toolFilter,force=[]}){ const model=S.settings.model||'lite';
  const decls=toolDecls(toolFilter); force=force.filter(n=>decls.some(d=>d.name===n)); if(force.length) extraSys+=`\nユーザーは @ で道具を指定しました。必ず次の道具を使って答えること：${force.join('、')}`; const contents=await toContents(msgs); const sys=sysPrompt(extraSys); const res={text:'',files:[],media:[],sources:[],steps:[],cards:[],actions:[]};
  ctx={...ctx,res,signal};
  let nudge=false, nudged=false, promised='';
  for(let round=0;round<maxRounds;round++){ let j;
    try{ j=await gemini(model,{contents,systemInstruction:{parts:[{text:sys}]},tools:decls.length?[{functionDeclarations:decls}]:undefined,generationConfig:{temperature:.7},toolConfig:(round===0&&force.length)?{functionCallingConfig:{mode:'ANY',allowedFunctionNames:force}}:nudge?{functionCallingConfig:{mode:'ANY',allowedFunctionNames:['create_file']}}:undefined},signal,{stream:t=>onText&&onText(t,round)}); }
    catch(e){ throw e; }
    const cand=j.candidates&&j.candidates[0]; const parts=(cand&&cand.content&&cand.content.parts)||[]; const calls=parts.filter(p=>p.functionCall);
    const txt=parts.filter(p=>p.text&&!p.thought).map(p=>p.text).join('');
    nudge=false;
    if(!calls.length){ const said=/(ファイル|\.(html?|js|css|py|txt|md|csv|json|svg))[^。\n]{0,30}(作り|作成|用意|保存し|まとめ)|ダウンロード(して|でき|ボタン)/.test(txt||'');
      if(said&&!res.files.length&&!nudged&&decls.some(d=>d.name==='create_file')){ nudged=true; nudge=true; promised=txt; contents.push({role:'model',parts:[{text:txt}]},{role:'user',parts:[{text:'（システム）ファイルを作ると言いましたが、まだ create_file を呼んでいません。今すぐ create_file で、言ったとおりのファイルを中身まで全部作ってください。'}]}); continue; }
      res.text=promised&&res.files.length?promised:(txt||promised||(cand&&cand.finishReason==='SAFETY'?'この内容にはお答えできません。':res.text||''));
      if(said&&!res.files.length) codeBlocksToFiles(res);
      return res; }
    contents.push({role:'model',parts});
    const outs=await Promise.all(calls.map(async p=>{ const fc=p.functionCall; const t=TOOLS[fc.name]; const step={name:fc.name,label:t?t.label(fc.args||{}):fc.name,icon:t?t.icon:'wrench',status:'run',args:fc.args}; res.steps.push(step); onStep&&onStep(res.steps);
      let out; try{ if(!t) throw new Error('この道具はありません'); out=await t.run(fc.args||{},ctx); step.status='ok'; }catch(e){ out={error:String(e&&e.message||e)}; step.status='err'; }
      step.result=typeof out==='string'?out.slice(0,1500):JSON.stringify(out).slice(0,1500); onStep&&onStep(res.steps); return {functionResponse:{name:fc.name,response:typeof out==='object'&&!Array.isArray(out)?out:{result:out}}}; }));
    contents.push({role:'user',parts:outs}); if(signal&&signal.aborted) throw new DOMException('aborted','AbortError'); }
  res.text=res.text||'作業が長くなったので、いったんここで止めました。続けるときは「続けて」と送ってください。'; return res; }

const ASPECT={'1:1':[1024,1024],'16:9':[1344,768],'9:16':[768,1344],'4:3':[1152,864],'3:4':[864,1152]};
async function genImage(prompt,{aspect='1:1',seed}={}){ const [w,hh]=ASPECT[aspect]||ASPECT['1:1']; let blob=null, via='';
  if(geminiKey().key&&!LS.get('noGemImg',0)){ try{ const im=(await imageModels())[0]; if(!im) throw new Error('quota limit: 0'); const j=await geminiRaw(im,{contents:[{role:'user',parts:[{text:prompt+`\n(aspect ratio ${aspect})`}]}],generationConfig:{responseModalities:['IMAGE','TEXT']}}); const p=((j.candidates&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).find(x=>x.inlineData); if(p){ blob=b64ToBlob(p.inlineData.data,p.inlineData.mimeType||'image/png'); via='Gemini'; } }catch(e){ if(/quota|RESOURCE_EXHAUSTED|429|limit: 0/i.test(e.message)) LS.set('noGemImg',Date.now()); } }
  if(LS.get('noGemImg',0)&&Date.now()-LS.get('noGemImg',0)>6*3600e3) LS.del('noGemImg');
  if(!blob){ seed=seed||Math.floor(Math.random()*1e9); const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${hh}&seed=${seed}&nologo=true&model=flux`; for(let t=0;t<2&&!blob;t++){ try{ const r=await fetchT(url,60000); if(r.ok&&/image/.test(r.headers.get('content-type')||'')){ blob=await r.blob(); via='Pollinations'; } }catch(e){} if(!blob) await sleep(1500); } }
  if(!blob){ blob=await artFallback(prompt,w,hh); via='その場で描いた図形'; }
  return {blob:await shrinkImage(blob,1280,.86),via,w,h:hh}; }
async function artFallback(text,w,hh){ const c=h('canvas',{width:w,height:hh}); const x=c.getContext('2d'); let s=0; for(const ch of text) s=(s*31+ch.charCodeAt(0))>>>0; const rnd=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  const hue=rnd()*360; const g=x.createLinearGradient(0,0,w,hh); g.addColorStop(0,`hsl(${hue},70%,55%)`); g.addColorStop(1,`hsl(${(hue+80)%360},70%,35%)`); x.fillStyle=g; x.fillRect(0,0,w,hh);
  for(let i=0;i<26;i++){ x.globalAlpha=.08+rnd()*.25; x.fillStyle=`hsl(${(hue+rnd()*140)%360},80%,${50+rnd()*30}%)`; x.beginPath(); x.arc(rnd()*w,rnd()*hh,20+rnd()*w*.25,0,7); x.fill(); } x.globalAlpha=1; return new Promise(ok=>c.toBlob(ok,'image/jpeg',.9)); }
function fetchT(url,ms=45000,opt={}){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); return fetch(url,{...opt,signal:c.signal}).finally(()=>clearTimeout(t)); }
async function loadBitmap(src){ try{ const r=await fetchT(src,40000); if(!r.ok) return null; return await createImageBitmap(await r.blob()); }catch(e){ return null; } }

function localCompose(desc,{seconds=40,mood='',tempo=0}={}){ const t=(desc+' '+mood).toLowerCase(); let seed=0; for(const ch of t) seed=(seed*31+ch.charCodeAt(0))>>>0; seed^=Date.now()&0xffff; const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };

  const hit=S2.find(([re])=>re.test(t))||[0,'pop',112,'pluck']; const style=hit[1];

async function wikiSearch(q,lang='ja',n=4){ const base=`https://${lang}.wikipedia.org/w/api.php?origin=*&format=json`; const r=await fetchT(base+'&action=query&list=search&srlimit='+n+'&srsearch='+encodeURIComponent(q),12000); const j=await r.json(); const hits=(j.query&&j.query.search)||[]; if(!hits.length) return [];
  const r2=await fetchT(base+'&action=query&prop=extracts&exintro=1&explaintext=1&exlimit=20&redirects=1&titles='+encodeURIComponent(hits.map(x=>x.title).join('|')),12000); const j2=await r2.json(); const pages=Object.values((j2.query&&j2.query.pages)||{});
  return hits.map(x=>{ const p=pages.find(pp=>pp.title===x.title)||{}; return {title:x.title,url:`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(x.title)}`,text:(p.extract||x.snippet.replace(/<[^>]+>/g,'')).slice(0,1500)}; }); }
tool('web_search',{icon:'search',need:'browser',label:a=>'Webで検索：'+short(a.query),desc:'Googleで最新情報を調べる。ニュース・値段・人物・営業時間など',params:OBJ({query:T('string','検索したいこと')},['query']),
  run:async(a,ctx)=>{ try{ const r=await geminiText(`次のことをGoogle検索で調べて、わかった事実を日本語で箇条書きにまとめて（出典の名前も）。\n${a.query}`,{tools:[{google_search:{}}],signal:ctx.signal,maxWait:8,rounds:2}); const gm=r.cand&&r.cand.groundingMetadata; const src=((gm&&gm.groundingChunks)||[]).map(c=>c.web).filter(Boolean).slice(0,8).map(w=>({title:w.title,url:w.uri}));
      src.forEach(s=>{ if(!ctx.res.sources.find(x=>x.url===s.url)) ctx.res.sources.push(s); }); if(r.text) return {summary:r.text,sources:src.map(s=>s.title)}; }catch(e){ if(e.name==='AbortError'||e.message==='NOKEY') throw e; console.warn('Google検索が使えないのでWikipediaで調べます',e); }
    let hits=await wikiSearch(a.query,'ja').catch(()=>[]); if(hits.length<2) hits=hits.concat(await wikiSearch(a.query,'en',3).catch(()=>[]));
    if(!hits.length) return {note:'Google検索が混み合っていて、Wikipediaにも見つかりませんでした。少し待ってからもう一度ためしてください。'};
    hits.forEach(x=>{ if(!ctx.res.sources.find(s=>s.url===x.url)) ctx.res.sources.push({title:'wikipedia.org：'+x.title,url:x.url}); });
    return {note:'Google検索が混み合っていたので、Wikipediaで調べた結果です（最新ニュースは含まれないことがあります）',results:hits}; }});

  run:async a=>({output:await sandboxRun(a.code)})});
function sandboxRun(code,ms=6000){ return new Promise(ok=>{ const f=h('iframe',{sandbox:'allow-scripts',style:'display:none'}); const key=uid(); const out=[]; const end=()=>{ removeEventListener('message',on); f.remove(); ok(out.join('\n').slice(0,8000)||'（出力なし）'); };
  const on=e=>{ if(!e.data||e.data.k!==key) return; if(e.data.t==='log') out.push(e.data.v); if(e.data.t==='done') end(); }; addEventListener('message',on);
  f.srcdoc=`<script>const K=${JSON.stringify(key)};const P=(t,v)=>parent.postMessage({k:K,t,v},'*');const F=x=>{try{return typeof x==='string'?x:JSON.stringify(x,null,1)}catch(e){return String(x)}};console.log=(...a)=>P('log',a.map(F).join(' '));console.error=(...a)=>P('log','エラー: '+a.map(F).join(' '));(async()=>{try{${code.replace(/<\/script/gi,'<\\/script')}\n}catch(e){P('log','エラー: '+e.message)}P('done')})();<\/script>`;
  document.body.append(f); setTimeout(()=>{ out.push('（時間切れで止めました）'); end(); },ms); }); }

const hdr=(p,n)=>((p.headers||[]).find(x=>x.name.toLowerCase()===n)||{}).value||'';
function mailBody(p){ if(!p) return ''; if(p.mimeType==='text/plain'&&p.body&&p.body.data) return ub64(p.body.data.replace(/-/g,'+').replace(/_/g,'/')); if(p.parts){ for(const x of p.parts){ const t=mailBody(x); if(t) return t; } } if(p.mimeType==='text/html'&&p.body&&p.body.data) return ub64(p.body.data.replace(/-/g,'+').replace(/_/g,'/')).replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' '); return ''; }
function rawMail(to,subject,body,extra={}){ const lines=[`To: ${to}`,`Subject: =?UTF-8?B?${b64u(subject)}?=`,'MIME-Version: 1.0','Content-Type: text/plain; charset=UTF-8','Content-Transfer-Encoding: base64']; if(extra.inReplyTo) lines.push('In-Reply-To: '+extra.inReplyTo,'References: '+extra.inReplyTo); return b64u(lines.join('\r\n')+'\r\n\r\n'+b64u(body)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

const SPRE=/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|artist|episode|show)\/([A-Za-z0-9]{22})/;
async function spOembed(url){ try{ const r=await fetchT('https://open.spotify.com/oembed?url='+encodeURIComponent(url),8000); if(r.ok) return await r.json(); }catch(e){} return null; }
tool('spotify_search',{icon:'disc-3',need:'spotify',label:a=>'Spotifyで探す：'+short(a.query),desc:'Spotifyの曲・アルバム・プレイリスト・アーティストを探して、チャットの中にSpotifyのプレーヤーを出す（ユーザーはその場で再生できる）',params:OBJ({query:T('string','探す言葉（曲名・アーティスト・気分など）'),type:T('string','種類',{enum:['track','album','playlist','artist']}),max:T('integer','件数 1〜4')},['query']),
  run:async(a,ctx)=>{ const t=a.type||'track', n=clamp(a.max||3,1,4); let items=[];
    if(SEC.get('spotify')){ try{ const j=await spfetch(`/search?type=${t}&limit=${n}&q=${encodeURIComponent(a.query)}`); items=(j[t+'s']&&j[t+'s'].items||[]).filter(Boolean).map(x=>({type:t,id:x.id,name:x.name,by:(x.artists||[]).map(r=>r.name).join(', ')||(x.owner&&x.owner.display_name)||'',uri:x.uri})); }catch(e){} }
    if(!items.length){ const kind={track:'曲',album:'アルバム',playlist:'プレイリスト',artist:'アーティスト'}[t]; const r=await geminiText(`Google検索で、Spotifyの「${a.query}」に合う${kind}のページ（https://open.spotify.com/${t}/... のURL）を${n}件見つけて、JSON配列 [{"url":"","name":"","by":"アーティスト名"}] だけを返して。URLは実在するものだけ。`,{tools:[{google_search:{}}],signal:ctx.signal});
      const m=r.text.match(/\[[\s\S]*\]/); let arr=[]; try{ arr=m?JSON.parse(m[0]):[]; }catch(e){} const seen=new Set();
      for(const v of arr){ const mm=String(v.url||'').match(SPRE); if(!mm||seen.has(mm[2])) continue; seen.add(mm[2]); items.push({type:mm[1],id:mm[2],name:v.name||'',by:v.by||''}); }
      if(!items.length){ (r.text.match(new RegExp(SPRE.source,'g'))||[]).forEach(u=>{ const mm=u.match(SPRE); if(!seen.has(mm[2])){ seen.add(mm[2]); items.push({type:mm[1],id:mm[2],name:'',by:''}); } }); } }
    items=items.slice(0,n); await Promise.all(items.map(async it=>{ const o=await spOembed(`https://open.spotify.com/${it.type}/${it.id}`); if(o){ it.ok=true; if(o.title) it.name=o.title; } }));
    const good=items.filter(it=>it.ok!==false); good.forEach(it=>ctx.res.cards.push({kind:'spotify',data:{embed:true,type:it.type,id:it.id,name:it.name,by:it.by,url:`https://open.spotify.com/${it.type}/${it.id}`,uri:`spotify:${it.type}:${it.id}`}}));
    return good.length?{shown:good.map(i=>i.name+(i.by?' / '+i.by:''))}:{note:'Spotifyで見つかりませんでした。YouTubeで探すこともできます'}; }});

/* ---- ZIPを開く（ブラウザの展開機能を使用） ---- */
async function unzip(buf){ const v=new DataView(buf), u8=new Uint8Array(buf); let e=-1; for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){ if(v.getUint32(i,true)===0x06054b50){ e=i; break; } } if(e<0) throw new Error('ZIPとして読めません');
  const n=v.getUint16(e+10,true); let p=v.getUint32(e+16,true); const files={}; const dec=new TextDecoder();
  for(let k=0;k<n;k++){ if(v.getUint32(p,true)!==0x02014b50) break; const method=v.getUint16(p+10,true), csize=v.getUint32(p+20,true), nl=v.getUint16(p+28,true), xl=v.getUint16(p+30,true), cl=v.getUint16(p+32,true), off=v.getUint32(p+42,true); const name=dec.decode(u8.subarray(p+46,p+46+nl)); p+=46+nl+xl+cl;
    if(name.endsWith('/')) continue; files[name]={size:v.getUint32(p-nl-xl-cl-46+24,true),read:async()=>{ const lnl=v.getUint16(off+26,true), lxl=v.getUint16(off+28,true); const data=u8.subarray(off+30+lnl+lxl,off+30+lnl+lxl+csize); if(method===0) return data; if(method!==8) throw new Error('この圧縮形式は読めません'); const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return new Uint8Array(await new Response(ds).arrayBuffer()); },text:async function(){ return new TextDecoder().decode(await this.read()); }}; }
  return files; }
const xmlText=s=>s.replace(/<\/(w:p|a:p|text:p|text:h|p|div|h\d|li|tr)>/g,'\n').replace(/<(w:tab|text:tab)\/>/g,'\t').replace(/<(w:br|text:line-break|br)\s*\/?>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,c)=>String.fromCharCode(c)).replace(/&amp;/g,'&').replace(/\n{3,}/g,'\n\n').trim();
const natural=(a,b)=>a.localeCompare(b,undefined,{numeric:true});
async function officeText(file){ const ext=(file.name.split('.').pop()||'').toLowerCase(); const z=await unzip(await file.arrayBuffer()); const names=Object.keys(z);
  if(ext==='docx') return xmlText(await z['word/document.xml'].text());
  if(ext==='pptx'){ const sl=names.filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort(natural); let out=''; for(let i=0;i<sl.length;i++) out+=`--- スライド${i+1} ---\n`+xmlText(await z[sl[i]].text())+'\n\n'; const nt=names.filter(n=>/^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(n)).sort(natural); if(nt.length){ out+='=== ノート ===\n'; for(const n of nt) out+=xmlText(await z[n].text())+'\n'; } return out; }
  if(ext==='xlsx'){ const ss=z['xl/sharedStrings.xml']?[...(await z['xl/sharedStrings.xml'].text()).matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>xmlText(m[1])):[]; const wb=z['xl/workbook.xml']?await z['xl/workbook.xml'].text():''; const sheetNames=[...wb.matchAll(/<sheet [^>]*name="([^"]+)"/g)].map(m=>m[1]);

const TEXT_EXT=/\.(txt|md|markdown|csv|tsv|json|js|mjs|ts|tsx|jsx|py|rb|php|java|kt|swift|c|h|cpp|hpp|cs|go|rs|html?|css|scss|xml|svg|yml|yaml|toml|ini|sh|bat|ps1|sql|log|ics|vtt|srt|tex|r|lua|dart|vue)$/i;
async function prepAtt(file){ const id=uid(); const name=file.name||'ファイル', ext=(name.split('.').pop()||'').toLowerCase(); const a={id,name,mime:file.type||guessMime(name),size:file.size};
  const asText=t=>{ if(t.length>200000) t=t.slice(0,200000)+'\n…（長いので途中まで）'; a.text=t; return a; };
  if(/^(docx|xlsx|pptx|odt|ods|odp|epub|zip)$/.test(ext)){ if(!('DecompressionStream' in window)) throw new Error('この端末では '+ext+' を開けません（iOS 16.4以降が必要です）'); try{ return asText(await officeText(file)); }catch(e){ throw new Error(name+' を読めませんでした：'+e.message); } }
  if(ext==='rtf') return asText(rtfText(await file.text()));
  if(/^(doc|xls|ppt)$/.test(ext)) throw new Error('古い形式（.'+ext+'）は読めません。新しい形式（.'+ext+'x）かPDFで保存し直してください');
  if(/^text\//.test(a.mime)||TEXT_EXT.test(name)||/json|xml|javascript/.test(a.mime)) return asText(await file.text());
  if(a.size>40*1048576) throw new Error(name+' は大きすぎます（40MBまで）');
  let blob=file;
  if(/^image\//.test(a.mime)||/^(heic|heif|bmp|tiff?|gif|avif)$/.test(ext)){ blob=await shrinkImage(file,1600,.85); if(blob===file&&!/^image\/(png|jpeg|webp|heic|heif)$/.test(a.mime)) throw new Error(name+' はこの端末で開けない画像です'); a.mime=blob.type||'image/jpeg'; a.size=blob.size; a.thumb=await makeThumb(blob,120); }
  else if(/^audio\//.test(a.mime)||/^(mp3|wav|m4a|aac|ogg|oga|flac|aiff?|opus|caf|amr)$/.test(ext)){ const native=/^(mp3|wav|aac|ogg|flac|aiff?)$/.test(ext); if(!native||a.size>12*1048576){ try{ blob=await audioToWav(file); a.mime='audio/wav'; a.size=blob.size; }catch(e){ if(!native) throw new Error(name+' をこの端末で読めませんでした'); } } else a.mime=({mp3:'audio/mp3',wav:'audio/wav',aac:'audio/aac',ogg:'audio/ogg',flac:'audio/flac',aif:'audio/aiff',aiff:'audio/aiff'})[ext]||a.mime; }
  else if(/^video\//.test(a.mime)||/^(mp4|m4v|mov|webm|mpe?g|avi|wmv|3gp|flv)$/.test(ext)){ a.mime=({mov:'video/mov',m4v:'video/mp4',mpg:'video/mpeg',avi:'video/avi',wmv:'video/wmv','3gp':'video/3gpp',flv:'video/x-flv'})[ext]||(a.mime&&a.mime.startsWith('video/')?a.mime:'video/mp4'); }
  else if(ext==='pdf'||a.mime==='application/pdf'){ a.mime='application/pdf'; }
  else { const u8=new Uint8Array(await file.slice(0,4096).arrayBuffer()); if(looksText(u8)) return asText(await file.text()); throw new Error(name+' はAIが読めない形式です（「AIが読めるファイルの種類」を見てね）'); }
  if(blob.size>15*1048576) throw new Error(name+' は大きすぎます（15MBまで）');
  a.data=await blobToB64(blob); try{ await IDB.set('att_'+id,blob); }catch(e){}
  if(a.data.length<900000){ try{ await DB.put('atts',id,{data:a.data,mime:a.mime},false); }catch(e){} } return a; }

const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();

    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true); ch.setUint32(42,off,true); central.push(ch.buffer,name); off+=30+name.length+data.length; }

  return new Blob([...parts,...central,end.buffer],{type:'application/zip'}); }
